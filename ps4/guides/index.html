<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cesarx9.CV / PS4 / GUÍAS</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <link rel="stylesheet" href="../../styles.css">
</head>

<body>

  <!-- Header -->
  <header class="top-bar">
    <div class="logo">
      <a href="../index.html" style="color: inherit; text-decoration: none;">CESARX9.CV<span>/PS4/GUIAS</span></a>
    </div>
    <div class="top-icons">
      <a href="../../index.html" class="font-icon" title="Volver al Inicio"><i class="fa-solid fa-house"></i></a>
    </div>
  </header>

  <main class="main-layout">
    <!-- Banner de Guías -->
    <section class="hero-section">
      <div class="decor star-left"><i class="fa-solid fa-star"></i></div>
      <div class="decor star-right"><i class="fa-solid fa-star"></i></div>
      <div class="decor dpad-left"><i class="fa-solid fa-gamepad"></i></div>
      <div class="decor dpad-right"><i class="fa-solid fa-gamepad"></i></div>
      <div class="mascot-container">
        <img src="https://api.iconify.design/emojione-v1:crocodile.svg" alt="Croc Mascot" class="mascot-img">
      </div>
      <h1 class="hero-title">GUÍAS Y TUTORIALES PS4</h1>
      <p style="color: #8a9ba8; margin-top: -15px; margin-bottom: 20px;">Aprende a configurar tu consola, instalar PKGs
        y optimizar GoldHEN</p>
    </section>

    <!-- Contenedor Principal de Guías -->
    <section class="resources-container">
      <div class="search-box">
        <i class="fa-solid fa-magnifying-glass search-icon"></i>
        <input type="text" id="search-guides" placeholder="Buscar guía (ej. GoldHEN, PKG, Reposo)...">
      </div>

      <div class="guides-grid" id="guides-grid">
        <!-- Se generan dinámicamente -->
      </div>
    </section>
  </main>

  <!-- Modal para leer la guía completa -->
  <div id="guide-modal" class="modal-overlay">
    <div class="modal-content" style="max-width: 600px;">
      <button class="modal-close" id="modal-close">&times;</button>
      <h2 id="guide-modal-title" style="color: #38bdf8; margin-bottom: 15px;"></h2>
      <div id="guide-modal-body" style="color: #cbd5e1; line-height: 1.6;"></div>
    </div>
  </div>

  <footer class="site-footer">
    <p>2026 - Cesarx9.cv</p>
  </footer>

  <script src="guides.js"></script>

</body>

</html>

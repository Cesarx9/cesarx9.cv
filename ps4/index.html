<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cesarx9.CV / PS4</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <link rel="stylesheet" href="../styles.css">
</head>

<body>
  <header class="top-bar">
    <div class="logo">
      <a href="../../index.html" style="color: inherit; text-decoration: none;">CESARX9.CV<span>/PS4</span></a>
    </div>
    <div class="top-icons">
      <a href="../../index.html" class="font-icon" title="Volver al Inicio"><i class="fa-solid fa-house"></i></a>
    </div>
  </header>

  <main class="main-layout">
    <section class="hero-section">
      <div class="decor star-left"><i class="fa-solid fa-star"></i></div>
      <div class="decor star-right"><i class="fa-solid fa-star"></i></div>
      <div class="decor dpad-left"><i class="fa-solid fa-gamepad"></i></div>
      <div class="decor dpad-right"><i class="fa-solid fa-gamepad"></i></div>

      <div class="mascot-container">
        <img src="https://api.iconify.design/emojione-v1:crocodile.svg" alt="Croc Mascot" class="mascot-img">
      </div>

      <h1 class="hero-title">¡Cesarx9 - PS4 lounge!</h1>

      <div class="action-buttons-bar">
        <a href="guides/index.html" class="nav-btn">
          <i class="fa-solid fa-book-open"></i>
          <span>GUÍAS</span>
        </a>
        <a href="recursos/index.html" class="nav-btn">
          <i class="fa-solid fa-wrench"></i>
          <span>RECURSOS</span>
        </a>
        <a href="https://ko-fi.com/cesarx9" class="nav-btn btn-kofi">
          <i class="fa-solid fa-heart"></i>
          <div class="btn-text">
            <span class="btn-title">KO-FI</span>
            <span class="btn-subtitle">(APOYA AL CREADOR)</span>
          </div>
        </a>
      </div>
    </section>

    <section class="resources-section">
      <div class="resources-container">
        <div class="search-box">
          <i class="fa-solid fa-magnifying-glass search-icon"></i>
          <input type="text" id="search-input" placeholder="Buscar juego por nombre (ej. Plague)...">
        </div>

        <div class="pkg-grid" id="pkg-grid">

        </div>

      </div>

      <a href="https://ko-fi.com/cesarx9" target="_blank" class="kofi-banner-card">
        <i class="fa-solid fa-heart kofi-icon"></i>
        <h3>APOYA EN KO-FI</h3>
      </a>
    </section>
  </main>

  <script src="games.js"></script>
  <script src="script.js"></script>

  <!-- Modal con Pestañas (Juego - Update - DLCs) -->
  <div id="links-modal" class="modal-overlay">
    <div class="modal-content" style="max-width: 550px;">
      <button class="modal-close" id="modal-close">&times;</button>
      <h3 id="modal-title" style="margin-bottom: 5px;">GAME [USA]</h3>
      <p class="modal-subtitle" style="margin-bottom: 12px;">Enlaces de descarga y complementos:</p>

      <!-- Pestañas del Modal -->
      <div class="modal-tabs"
        style="display: flex; gap: 8px; border-bottom: 1px solid #30363d; padding-bottom: 8px; margin-bottom: 12px;">
        <button class="tab-btn active" data-tab="tab-game"
          style="background: #1f6feb; color: #fff; border: none; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 0.85rem;">Juego</button>
        <button class="tab-btn" data-tab="tab-update"
          style="background: #21262d; color: #8b949e; border: 1px solid #30363d; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 0.85rem;">Update</button>
        <button class="tab-btn" data-tab="tab-dlcs"
          style="background: #21262d; color: #8b949e; border: 1px solid #30363d; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 0.85rem;">DLCs</button>
      </div>

      <!-- Contenedores de las Pestañas -->
      <div id="tab-game" class="tab-pane active-pane">
        <div id="mirrors-container" style="max-height: 180px; overflow-y: auto; margin-bottom: 12px;"></div>
      </div>

      <div id="tab-update" class="tab-pane" style="display: none;">
        <div id="updates-container" style="max-height: 180px; overflow-y: auto; margin-bottom: 12px;"></div>
      </div>

      <div id="tab-dlcs" class="tab-pane" style="display: none;">
        <div id="dlcs-container" style="max-height: 180px; overflow-y: auto; margin-bottom: 12px;"></div>
      </div>

      <!-- Sección RPI (Compartida) -->
      <div class="rpi-container"
        style="background: rgba(0,0,0,0.2); padding: 12px; border-radius: 6px; border: 1px solid #30363d;">
        <div style="display: flex; gap: 10px; margin-bottom: 10px;">
          <div style="flex: 3;">
            <label for="ps4-ip" style="display:block; font-size: 0.8rem; margin-bottom: 4px; color: #ccc;">IP de la
              PS4:</label>
            <input type="text" id="ps4-ip" placeholder="Ej: 192.168.1.15"
              style="padding: 6px; border-radius: 4px; border: 1px solid #333; background: #111; color: #fff; width: 100%;">
          </div>
          <div style="flex: 1.5;">
            <label for="ps4-port"
              style="display:block; font-size: 0.8rem; margin-bottom: 4px; color: #ccc;">Puerto:</label>
            <input type="text" id="ps4-port" value="12800" placeholder="12800"
              style="padding: 6px; border-radius: 4px; border: 1px solid #333; background: #111; color: #fff; width: 100%;">
          </div>
        </div>

        <button id="btn-rpi-install"
          style="background-color: #28a745; color: white; border: none; padding: 10px 15px; border-radius: 5px; cursor: pointer; width: 100%; font-weight: bold;">
          🚀 Instalar Directo en PS4
        </button>

        <p id="rpi-status" style="font-size: 0.8rem; margin-top: 8px; margin-bottom: 0; text-align: center;"></p>
      </div>
    </div>
  </div>

  <footer class="site-footer">
    <p>2026 - Cesarx9.cv</p>
  </footer>
</body>

</html>

<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CESARX9.CV | Multi-System Hub</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@600;700&display=swap" rel="stylesheet">

<body>

    <header class="top-bar">
        <div class="logo">
            CESARX9.CV<span>/HUB</span>

    <main class="main-layout">
        <section class="hero-section">
            <div class="mascot-container">
                <img src="https://api.iconify.design/emojione-v1:crocodile.svg" alt="Croc Mascot" class="mascot-img">
            </div>

            <p style="color: #8a9ba8; margin-top: -15px; margin-bottom: 30px;">Recursos, PKGs, ROMs y Guías organizados

        </section>

        <!-- Tarjetas de Selección de Consola -->
        <div class="systems-grid">

            <!-- Tarjeta PS4 -->
            <a href="ps4/index.html" class="system-card ps4-card">
                <div class="system-icon">
                    <i class="fa-brands fa-playstation"></i>

                    <h2>PLAYSTATION 4</h2>
                    <p>866 PKGs, Homebrew, GoldHEN & Guías</p>

            <a href="#" class="system-card x360-card">
                <div class="system-icon">
                    <i class="fa-brands fa-xbox"></i>
                </div>
                <div class="system-info">
                    <h2>XBOX 360</h2>
                    <p>Juegos GOD, XEX, Aurora & RGH</p>
                </div>
                <span class="system-status coming-status">PRÓXIMAMENTE</span>

    <footer class="site-footer">
